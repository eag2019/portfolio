<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eric Garcia Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout idea: the whole site is "Eric OS", an original desktop. Icons open chunky windows; a floating dock shows open windows and switches wallpapers. */
:root{
  --ink:#14161B;
  --paper:#FFFFFF;
  --muted:#5B6170;
  --line:#E3E5EA;
  --soft:#F4F5F8;
  --accent:#1F6FFF;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);font-size:15.5px;line-height:1.55;color:var(--ink);background:var(--ink);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}

/* ---------- wallpapers ---------- */
.desk{position:relative;height:100%;overflow:hidden;isolation:isolate}
.desk[data-wall="ocean"]  {--w0:#0E5E7A;--w1:#18C2C9;--w2:#7BF0D0;--w3:#2F7BFF;--accent:#1F6FFF;--chip:#0E5E7A}
.desk[data-wall="sunset"] {--w0:#FF7A59;--w1:#FFC24B;--w2:#FF4F87;--w3:#FFA3C4;--accent:#E8475F;--chip:#B8324A}
.desk[data-wall="citrus"] {--w0:#2BC48A;--w1:#E9F55A;--w2:#58D7F0;--w3:#FFE07A;--accent:#0F9A68;--chip:#0B7A52}
.desk[data-wall="midnight"]{--w0:#0B1030;--w1:#3B2AFF;--w2:#FF3D9A;--w3:#00D1C1;--accent:#5C7CFF;--chip:#3B2AFF}
.desk[data-wall="zion"]    {--w0:#C0532F;--w1:#F2A66E;--w2:#E07A4F;--w3:#7FA7C9;--accent:#C0532F;--chip:#9B3A22}
.desk[data-wall="forest"]  {--w0:#2F5E49;--w1:#9CC7AE;--w2:#5E9A7B;--w3:#D9E8C9;--accent:#2F7A55;--chip:#1C3D2F}
#scene{position:absolute;inset:0;width:100%;height:100%;display:none}
.desk[data-wall="zion"] #scene,.desk[data-wall="forest"] #scene{display:block}
.desk[data-wall="zion"] .wall::after,.desk[data-wall="forest"] .wall::after{display:none}
.wall{position:absolute;inset:0;z-index:-1;background:var(--w0);transition:background .6s}
.wall span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;transition:background .6s}
.wall .b1{width:55vw;height:55vw;left:-10vw;top:-15vw;background:var(--w1);animation:drift1 22s ease-in-out infinite alternate}
.wall .b2{width:45vw;height:45vw;right:-8vw;top:10vh;background:var(--w2);animation:drift2 26s ease-in-out infinite alternate}
.wall .b3{width:50vw;height:50vw;left:25vw;bottom:-25vw;background:var(--w3);animation:drift1 30s ease-in-out infinite alternate-reverse}
.wall::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:22px 22px}
@keyframes drift1{to{transform:translate(8vw,6vh) scale(1.08)}}
@keyframes drift2{to{transform:translate(-6vw,8vh) scale(.92)}}

/* ---------- desktop icons ---------- */
.icons{position:absolute;top:24px;left:20px;display:grid;grid-auto-flow:row;gap:8px;z-index:1}
.icon{all:unset;cursor:pointer;width:92px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 4px;border-radius:14px;color:#fff;font-weight:600;font-size:.82rem;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.icon:hover{background:rgba(255,255,255,.18)}
.icon:focus-visible{outline:3px solid #fff;outline-offset:0}
.tile{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.icon:hover .tile{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tile svg{width:26px;height:26px}
.tile.c1{background:#FFD84D}.tile.c2{background:#7CF0C5}.tile.c3{background:#FF9BB3}.tile.c4{background:#9DB9FF}.tile.c5{background:#FFFFFF}.tile.c6{background:#FFB86B}

/* ---------- widgets ---------- */
.widgets{position:absolute;top:24px;right:24px;display:flex;flex-direction:column;gap:12px;width:230px;z-index:1}
.widget{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:5px 5px 0 var(--ink)}
.widget .time{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.widget .date{color:var(--muted);font-size:.88rem;margin-top:4px}
.widget h4{font-size:.95rem;margin-bottom:6px}
.widget p{font-size:.86rem;color:var(--muted)}
.bar{height:8px;border-radius:8px;background:var(--line);margin-top:10px;overflow:hidden;border:1.5px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--accent);transition:background .6s}
@media (max-width:1000px){.widgets{display:none}}

/* ---------- windows ---------- */
#windows{position:absolute;inset:0;z-index:2;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);max-height:calc(100% - 120px);overflow:hidden;animation:open .22s cubic-bezier(.2,.9,.3,1.25)}
@keyframes open{from{transform:scale(.9)}to{transform:none}}
.win.min{display:none}
.win.focused{box-shadow:10px 10px 0 var(--ink)}
.win-bar{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;background:var(--wc,#FFD84D);border-bottom:2px solid var(--ink);cursor:grab;user-select:none;touch-action:none}
.win-bar:active{cursor:grabbing}
.win-bar .glyph{width:22px;height:22px;display:grid;place-items:center}
.win-bar .glyph svg{width:18px;height:18px}
.win-bar b{flex:1;font-family:var(--display);font-weight:700;font-size:.98rem}
.wbtn{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:.9rem;line-height:1}
.wbtn:hover{background:var(--ink);color:var(--paper)}
.wbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.win-body{padding:20px;overflow:auto}
.win-body > * + *{margin-top:14px}
.lede{font-size:1.02rem}
.muted{color:var(--muted)}

/* projects */
.proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:520px){.proj-grid{grid-template-columns:1fr 1fr}}
.proj{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);transition:transform .15s,box-shadow .15s}
.proj:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.proj:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:4/3;border-radius:9px;border:1.5px solid var(--ink);background:linear-gradient(135deg,var(--w1),var(--w3));display:flex;flex-direction:column;gap:5px;padding:9px;transition:background .6s}
.thumb span{display:block;border-radius:3px;background:rgba(255,255,255,.85);height:7px}
.thumb span:first-child{width:55%;height:9px;background:var(--ink)}
.thumb span:nth-child(2){width:80%}
.thumb span:nth-child(3){width:40%}
.thumb.has-img{background-size:cover;background-position:left top;padding:0}
.win-body .built{font-size:.95rem;margin-top:18px}
.win-body .built + .tags{margin-top:8px}
.shot-img{display:block;width:100%;border-radius:12px;border:2px solid var(--ink)}
.crm-thumb{background:#F3F7FF;display:flex;flex-direction:column;gap:6px;padding:8px}
.crm-thumb .ct-h{height:9px;width:50%;border-radius:3px;background:var(--ink)}
.crm-thumb .ct-cols{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:none;height:auto}
.crm-thumb .ct-cols i{display:flex;flex-direction:column;gap:4px;background:#E2E9F7;border-radius:4px;padding:4px}
.crm-thumb em{display:block;height:10px;border-radius:3px;background:#fff;border-left:3px solid #22C995}
.cover{position:relative;display:flex;flex-direction:column;gap:12px;aspect-ratio:16/9;border-radius:12px;border:2px solid var(--ink);padding:16px;text-decoration:none;color:var(--ink);background:linear-gradient(160deg,#EAF6FF,#D7FBEC);overflow:hidden}
.cover-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cover-top b{font-family:var(--display);font-size:1.1rem}
.cover-top small{color:var(--muted)}
.cover-board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cover-board > span{background:rgba(255,255,255,.75);border:1.5px solid var(--ink);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px}
.cover-board small{font-size:.68rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover-board i{display:block;height:16px;border-radius:5px;background:#fff;border:1px solid var(--line);border-left:4px solid #1F8A70}
.play{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:4px 4px 0 #22C995;transition:transform .15s}
.play svg{width:28px;height:28px;margin-left:3px}
.cover:hover .play{transform:translate(-50%,-50%) scale(1.08)}
.cover-note{position:absolute;right:12px;bottom:10px;font-size:.78rem;font-weight:700;background:var(--ink);color:#fff;padding:3px 10px;border-radius:999px}
.img-cover{padding:0;aspect-ratio:auto;background:none;display:block}
.img-cover img{display:block;width:100%;height:auto}
.img-cover .play{top:50%;left:70%;opacity:.92}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn.ghost{background:var(--paper);color:var(--ink)}
.proj.empty{border-style:dashed;cursor:default}
.proj.empty:hover{transform:none;box-shadow:none}
.proj.empty .thumb{background:repeating-linear-gradient(45deg,var(--soft) 0 9px,#E8EAF0 9px 18px);display:grid;place-items:center;font-family:var(--display);font-size:1.8rem;color:var(--muted)}
.proj b{font-size:.92rem;line-height:1.25}
.proj small{color:var(--muted);font-size:.8rem}

.shot{aspect-ratio:16/9;border-radius:12px;border:2px solid var(--ink);background:linear-gradient(135deg,var(--w1),var(--w2) 55%,var(--w3));display:grid;place-items:center;text-align:center;color:var(--ink);font-weight:600;padding:16px;transition:background .6s}
.shot small{display:block;font-weight:400}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:16px 0 0;font-size:.93rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:.8rem;font-weight:600;padding:4px 11px;border-radius:999px;border:1.5px solid var(--ink);background:var(--soft)}
.btn{display:inline-flex;align-items:center;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--accent);color:#fff;font-weight:700;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}

/* crm */
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.job{border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
.job:nth-child(1){background:#FFF3C4}.job:nth-child(2){background:#D7FBEC}.job:nth-child(3){background:#FFE1E8}.job:nth-child(4){background:#E2EAFF}
.job h4{font-size:.98rem;margin-bottom:3px}
.job p{font-size:.86rem;color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stage{background:var(--soft);border-radius:10px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c)}
.stage[data-stage="0"]{--c:#4A7DFF}.stage[data-stage="1"]{--c:#FFC93C}.stage[data-stage="2"]{--c:#FF5C7A}.stage[data-stage="3"]{--c:#22C995}
.stage h5{margin:0;font-size:.74rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.deal{all:unset;cursor:pointer;background:var(--paper);border:1.5px solid var(--ink);border-left:5px solid var(--c);border-radius:7px;padding:6px 8px;font-size:.78rem;line-height:1.25}
.deal:hover{transform:translateY(-1px)}
.deal:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage[data-stage="3"] .deal{cursor:default}
.deal.arrived{animation:pop .3s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}
.log{display:block;font-family:var(--mono);font-size:.78rem;background:var(--ink);color:#9EF5CF;padding:10px 12px;border-radius:10px;min-height:3.4em}
@media (max-width:520px){.stages{grid-template-columns:1fr 1fr}.jobs{grid-template-columns:1fr}}

/* about */
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--ink)}
.timeline li{position:relative;padding:0 0 18px 20px}
.timeline li::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.timeline time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.timeline h4{font-size:1rem;margin:1px 0 2px}
.timeline p{font-size:.88rem;color:var(--muted)}
.hello{display:flex;gap:14px;align-items:center}
.avatar{width:60px;height:60px;flex:none;border-radius:18px;border:2px solid var(--ink);background:linear-gradient(135deg,var(--w1),var(--w2));display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;transition:background .6s}
.hello h2{font-size:1.5rem}

/* wallpaper picker */
.walls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wall-opt{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
.wall-opt i{display:block;aspect-ratio:16/10;border-radius:12px;border:2px solid var(--ink)}
.wall-opt[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.wall-opt:focus-visible{outline:3px solid var(--accent);outline-offset:4px}

/* contact */
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600}
.links a:hover{background:var(--soft)}
.links a span{color:var(--muted);font-weight:400}

/* ---------- dock ---------- */
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);max-width:calc(100% - 24px)}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:13px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:.92rem;white-space:nowrap}
.logo i{width:24px;height:24px;border-radius:8px;background:conic-gradient(from 90deg,var(--w1),var(--w2),var(--w3),var(--w1));transition:background .6s}
.logo:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;border:1.5px solid var(--ink);font-size:.82rem;font-weight:600;white-space:nowrap;background:var(--paper)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wc)}
.chip.active{background:var(--ink);color:#fff}
.chip.min{opacity:.55}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:5px;padding-left:8px;border-left:1.5px solid var(--line)}
.sw{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.sw:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:640px){.logo span{display:none}.logo{padding:6px}}

/* ---------- phone layout ---------- */
@media (max-width:700px){
  .icons{grid-template-columns:repeat(3,1fr);left:50%;transform:translateX(-50%);top:20px}
  .win{left:8px!important;right:8px;width:auto!important;top:auto!important;bottom:84px;max-height:calc(100% - 110px)}
  .win-bar{cursor:default}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="desk" id="desk" data-wall="zion">
  <div class="wall" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><canvas id="scene"></canvas></div>

  <nav class="icons" id="icons" aria-label="Desktop"></nav>

  <aside class="widgets" aria-label="Widgets">
    <div class="widget"><div class="time" id="w-time"></div><div class="date" id="w-date"></div></div>
    <div class="widget"><h4>Now building</h4><p>More CRMs and websites.</p><div class="bar" role="img" aria-label="Next project in progress"><i style="width:55%"></i></div></div>
  </aside>

  <div id="windows"></div>

  <div class="dock" role="toolbar" aria-label="Dock">
    <button class="logo" id="logo" type="button" aria-label="Open the welcome window"><i></i><span>Eric OS</span></button>
    <div class="chips" id="chips"></div>
    <div class="swatches" id="swatches" role="group" aria-label="Wallpaper"></div>
  </div>
</div>

<script>
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const desk = document.getElementById("desk");
  const layer = document.getElementById("windows");
  const isPhone = () => innerWidth <= 700;

  /* ---------- icons (inline svg) ---------- */
  const G = {
    folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    crm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
    me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.2-6.5 8-6.5s7 2 8 6.5"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    paint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3" fill="currentColor"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/><circle cx="16" cy="10" r="1.3" fill="currentColor"/><path d="M12 21a3 3 0 0 1 0-6h2"/></svg>',
    site:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>'
  };

      <div class="hello"><div class="avatar">EG</div><div><h2>Eric Garcia</h2><p class="muted">CRM builder and student at Dixie Tech</p></div></div>
      <p class="lede">I'm a CRM student at Dixie Tech who designs and builds complete Zoho CRM systems. I like digging into how a business actually runs, finding where things slip through the cracks, and setting up a CRM that fixes it.</p>

      <ol class="timeline">
        <li><time>Now</time><h4>Student, Dixie Tech</h4><p>Learning CRM administration and how to shape a system around a real business.</p></li>
        <li><time>Building</time><h4>Zoho CRM systems</h4><p>Designing modules, workflows, blueprints and templates, like my Harborview Insurance build.</p></li>

  function openApp(id){
    if (open.has(id)){ focusWin(id); return; }
    const a = apps[id];
    const el = document.createElement("section");
    el.className = "win"; el.setAttribute("aria-label", a.title);
    el.style.setProperty("--wc", a.color);
    const W = layer.clientWidth, H = layer.clientHeight;
    const width = Math.min(a.w, W - 40);
    el.style.width = width + "px";
    const n = open.size * 26;
    el.style.left = Math.max(12, Math.min(W * a.x + n, W - width - 16)) + "px";
    const topPx = Math.max(12, Math.min(H * a.y + n, H - 260));
    el.style.top = topPx + "px";
    if (!isPhone()) el.style.maxHeight = Math.max(240, H - topPx - 96) + "px";
    el.innerHTML = `<div class="win-bar"><span class="glyph">${G[a.icon]}</span><b>${a.title}</b>
      <button class="wbtn" type="button" data-act="min" aria-label="Minimize ${a.title}">–</button>
      <button class="wbtn" type="button" data-act="close" aria-label="Close ${a.title}">×</button></div>
      <div class="win-body">${a.html()}</div>`;
    el.querySelector('[data-act="close"]').addEventListener("click", () => closeApp(id));
    el.querySelector('[data-act="min"]').addEventListener("click", () => { el.classList.add("min"); open.get(id).min = true; renderChips(); });
    el.addEventListener("pointerdown", () => focusWin(id));
    el.addEventListener("keydown", e => { if (e.key === "Escape") closeApp(id); });
    el.querySelectorAll("[data-launch]").forEach(b => b.addEventListener("click", () => openApp(b.dataset.launch)));
    el.querySelectorAll("[data-project]").forEach(b => b.addEventListener("click", () => openApp(b.dataset.project)));
    if (a.mount) a.mount(el);
    makeDraggable(el, el.querySelector(".win-bar"));
    layer.appendChild(el);
    open.set(id, {el, min:false, title:a.title, color:a.color});
    focusWin(id);
  }
  function closeApp(id){
    const w = open.get(id); if (!w) return;
    w.el.remove(); open.delete(id); renderChips();
  }
  function makeDraggable(win, handle){
    handle.addEventListener("pointerdown", e => {
      if (e.target.closest(".wbtn") || isPhone()) return;
      const sx = e.clientX - win.offsetLeft, sy = e.clientY - win.offsetTop;
      handle.setPointerCapture(e.pointerId);
      const move = ev => {
        const maxX = layer.clientWidth - 80, maxY = layer.clientHeight - 60;
        win.style.left = Math.min(maxX, Math.max(-win.offsetWidth + 80, ev.clientX - sx)) + "px";
        win.style.top = Math.min(maxY, Math.max(0, ev.clientY - sy)) + "px";
      };
      const up = () => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); };
      handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up);
    });
  }

  /* ---------- dock ---------- */
  const chipsEl = document.getElementById("chips");
  function renderChips(){
    chipsEl.innerHTML = "";
    let top = null, topZ = -1;
    open.forEach((w,k) => { const zz = +w.el.style.zIndex; if (!w.min && zz > topZ){ topZ = zz; top = k; } });
    open.forEach((w,k) => {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip" + (k === top ? " active" : "") + (w.min ? " min" : "");
      c.style.setProperty("--wc", w.color);
      c.textContent = w.title;
      c.setAttribute("aria-label", (w.min ? "Restore " : "Show ") + w.title);
      c.addEventListener("click", () => {
        if (k === top){ w.el.classList.add("min"); w.min = true; renderChips(); }
        else focusWin(k);
      });
      chipsEl.appendChild(c);
    });
  }
  document.getElementById("logo").addEventListener("click", () => openApp("welcome"));

  const swEl = document.getElementById("swatches");
  walls.forEach(w => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sw"; b.style.background = w.g; b.dataset.wall = w.id;
    b.setAttribute("aria-label", w.name + " wallpaper");
    b.addEventListener("click", () => setWall(w.id));
    swEl.appendChild(b);
  });
  function setWall(id){
    desk.dataset.wall = id;
    drawScene();
    document.querySelectorAll("[data-wall]").forEach(b => { if (b !== desk) b.setAttribute("aria-pressed", b.dataset.wall === id); });
    try { localStorage.setItem("eg-wall", id); } catch(e){}
  }

  /* ---------- landscape wallpapers (Zion, Forest) ---------- */
  const scenes = {
    zion:{ sky:["#6E9CC4","#F7C994"], sun:"#FFF1C9", sunY:.32,
      layers:["#E8A57C","#D9774E","#C0532F","#983A22","#5E2416"], mesa:true, greens:true },
    forest:{ sky:["#8FBFA8","#E3EEDF"], sun:"#FFFDF2", sunY:.26,
      layers:["#B4D4C0","#86B79B","#5C9479","#3A6B53","#1F4333"], pines:true }
  };
  const cv = document.getElementById("scene"), cx = cv.getContext("2d");
  function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function drawScene(){
    const sc = scenes[desk.dataset.wall]; if (!sc) return;
    const dpr = Math.min(devicePixelRatio || 1, 2), W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !H) return;
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const sky = cx.createLinearGradient(0,0,0,H*.75);
    sky.addColorStop(0, sc.sky[0]); sky.addColorStop(1, sc.sky[1]);
    cx.fillStyle = sky; cx.fillRect(0,0,W,H);
    cx.fillStyle = sc.sun; cx.globalAlpha = .9;
    cx.beginPath(); cx.arc(W*.7, H*sc.sunY, Math.min(W,H)*.07, 0, Math.PI*2); cx.fill(); cx.globalAlpha = 1;
    const r = rng(sc.mesa ? 7 : 42);
    sc.layers.forEach((col, i) => {
      const t = i / (sc.layers.length - 1);
      const base = H * (.42 + t * .36), amp = H * (sc.mesa ? .26 - t*.1 : .12 - t*.04);
      const f = [r()*2+1, r()*4+3, r()*9+6], ph = [r()*6, r()*6, r()*6];
      const pts = [];
      for (let x = 0; x <= W; x += 4){
        const u = x / W;
        let n = .55*Math.sin(u*f[0]*Math.PI+ph[0]) + .3*Math.sin(u*f[1]*Math.PI+ph[1]) + .15*Math.sin(u*f[2]*Math.PI+ph[2]);
        n = (n + 1) / 2;
        if (sc.mesa){ n = Math.min(n, .72); n = Math.pow(n, 2.2) * 1.9; n = Math.round(n * 4) / 4 * .6 + n * .4; }
        pts.push([x, base - n * amp]);
      }
      cx.fillStyle = col;
      cx.beginPath(); cx.moveTo(0, H);
      pts.forEach(([x,y]) => cx.lineTo(x, y));
      cx.lineTo(W, H); cx.closePath(); cx.fill();
      if (sc.pines && i >= 2){
        const size = 14 + t * 34, step = size * .7;
        for (let x = -10; x < W + 10; x += step * (.6 + r()*.8)){
          const y = pts[Math.max(0, Math.min(pts.length-1, Math.round(x/4)))][1] + size*.3;
          const h = size * (.8 + r()*.6);
          cx.beginPath(); cx.moveTo(x, y - h); cx.lineTo(x + h*.32, y); cx.lineTo(x - h*.32, y); cx.closePath(); cx.fill();
        }
      }
      if (sc.greens && i >= 2){
        /* juniper and pinyon growing in clumps along clifftops and ledges */
        const shrubs = ["#6F7F45","#56693A","#4A5F33"];
        const clumps = Math.round(W / (150 - i*20));
        for (let k = 0; k < clumps; k++){
          const cx0 = r() * W;
          const n = 3 + Math.floor(r()*5);
          for (let j = 0; j < n; j++){
            const x = cx0 + (r()-.5) * 40 * (1 + t);
            const pi = Math.max(0, Math.min(pts.length-1, Math.round(x/4)));
            const y = pts[pi][1] + 2 + r() * 6 * (1 + t);
            const rad = (2 + t*4.5) * (.6 + r()*.7);
            cx.fillStyle = shrubs[Math.floor(r()*3)];
            cx.beginPath(); cx.ellipse(x, y, rad*1.4, rad, 0, 0, Math.PI*2); cx.fill();
          }
        }
      }
      if (i < sc.layers.length - 1){
        const haze = cx.createLinearGradient(0, base - amp, 0, H);
        haze.addColorStop(0, "rgba(255,255,255,0)"); haze.addColorStop(1, "rgba(255,255,255,.12)");
        cx.fillStyle = haze; cx.fillRect(0, base - amp, W, H);
      }
    });
    if (sc.greens){
      /* green valley floor with cottonwood trees, like Zion Canyon along the river */
      const top = H * .88, vr = rng(99);
      const floor = [];
      for (let x = 0; x <= W; x += 6) floor.push([x, top + Math.sin(x/W*Math.PI*3+1)*H*.012 + Math.sin(x/W*Math.PI*9)*H*.005]);
      cx.fillStyle = "#4E6B34";
      cx.beginPath(); cx.moveTo(0, H); floor.forEach(([x,y]) => cx.lineTo(x,y)); cx.lineTo(W, H); cx.closePath(); cx.fill();
      const leaves = ["#7FA14A","#6A8F3E","#5A7E35","#8DB056"];
      for (let x = -20; x < W + 20; x += 16 + vr()*26){
        const y = floor[Math.max(0, Math.min(floor.length-1, Math.round(x/6)))][1];
        const size = 16 + vr()*30;
        for (let k = 0; k < 4; k++){
          cx.fillStyle = leaves[Math.floor(vr()*leaves.length)];
          cx.beginPath();
          cx.arc(x + (vr()-.5)*size, y - size*.55 + (vr()-.5)*size*.5, size*(.45 + vr()*.3), 0, Math.PI*2);
          cx.fill();
        }
      }
      cx.fillStyle = "#3F5A2B";
      cx.fillRect(0, top + H*.05, W, H);
    }
  }
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawScene, 120); });

  /* ---------- widgets ---------- */
  const tEl = document.getElementById("w-time"), dEl = document.getElementById("w-date");
  function tick(){
    const d = new Date();
    tEl.textContent = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    dEl.textContent = d.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
  }
  tick(); setInterval(tick, 10000);

  /* ---------- CRM pipeline ---------- */
  function mountPipeline(el){
    const stageNames = ["New","Contacted","Quote sent","Customer"];
    const notes = ["added from the website form.","called back. Reminder set for Friday.","got a quote. Follow-up in 3 days if no reply.","is now a customer. Welcome email sent automatically."];
    const deals = [{name:"Maple Street Bakery",stage:0},{name:"Ridge Roofing",stage:0},{name:"Bloom Dental",stage:1},{name:"Northside Auto",stage:2},{name:"Harbor Yoga",stage:3}];
    const root = el.querySelector("[data-pipeline]"), log = el.querySelector("[data-log]");
    let moved = null;
    (function render(){
      root.innerHTML = "";
      stageNames.forEach((label,i) => {
        const col = document.createElement("div");
        col.className = "stage"; col.dataset.stage = i;
        const inStage = deals.filter(d => d.stage === i);
        col.innerHTML = `<h5><span>${label}</span><span>${inStage.length}</span></h5>`;
        inStage.forEach(d => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "deal" + (d === moved ? " arrived" : "");
          b.textContent = d.name;
          if (i < 3){
            b.setAttribute("aria-label", `${d.name}. Move to ${stageNames[i+1]}`);
            b.addEventListener("click", () => { d.stage++; moved = d; log.textContent = `> ${d.name} ${notes[d.stage]}`; render(); });
          }
          col.appendChild(b);
        });
        root.appendChild(col);
      });
    })();
  }

  /* ---------- start state ---------- */
  let saved = null; try { saved = localStorage.getItem("eg-wall"); } catch(e){}
  setWall(walls.some(w => w.id === saved) ? saved : "zion");

  if (isPhone()) openApp("welcome");
  else { openApp("projects"); openApp("welcome"); }
})();
</script>
</body>
